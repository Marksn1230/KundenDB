services:
  identity-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?npm run setup zuerst ausführen}
    volumes:
      - identity-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: [start-dev, --import-realm]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://identity-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?required}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?required}
      KC_HOSTNAME: http://localhost:8080
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?required}
      APP_URL: ${APP_URL:?required}
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      identity-db:
        condition: service_healthy
    restart: unless-stopped
  web:
    profiles: [full]
    build: .
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/kunden.sqlite
      OIDC_ADMIN_URL: http://keycloak:8080/admin/realms/kundenraum
      OIDC_INTERNAL_URL: http://keycloak:8080
    ports:
      - 127.0.0.1:3000:3000
    volumes:
      - customer-data:/app/data
    restart: unless-stopped
  worker:
    profiles: [full]
    build: .
    command: [npm, run, worker]
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/kunden.sqlite
    volumes:
      - customer-data:/app/data
    restart: unless-stopped
volumes:
  identity-data:
  customer-data:
