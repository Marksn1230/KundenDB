{
  "name": "kundenraum",
  "services": {
    "db": {
      "image": "postgres:17.11-alpine",
      "environment": {
        "POSTGRES_USER": "postgres",
        "POSTGRES_PASSWORD": "${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD setzen}",
        "APP_DB_USER": "kundenraum",
        "APP_DB_NAME": "kundenraum",
        "APP_DB_PASSWORD": "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD setzen}"
      },
      "volumes": [
        "customer-db-data:/var/lib/postgresql/data",
        "./deploy/init-database.sh:/docker-entrypoint-initdb.d/10-application.sh:ro"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U postgres -d kundenraum"
        ],
        "interval": "5s",
        "timeout": "5s",
        "retries": 30
      },
      "restart": "unless-stopped"
    },
    "identity-db": {
      "image": "postgres:17.11-alpine",
      "environment": {
        "POSTGRES_USER": "postgres",
        "POSTGRES_PASSWORD": "${KEYCLOAK_DB_ADMIN_PASSWORD:?KEYCLOAK_DB_ADMIN_PASSWORD setzen}",
        "APP_DB_USER": "keycloak",
        "APP_DB_NAME": "keycloak",
        "APP_DB_PASSWORD": "${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD setzen}"
      },
      "volumes": [
        "identity-db-data:/var/lib/postgresql/data",
        "./deploy/init-database.sh:/docker-entrypoint-initdb.d/10-application.sh:ro"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U postgres -d keycloak"
        ],
        "interval": "5s",
        "timeout": "5s",
        "retries": 30
      },
      "restart": "unless-stopped"
    },
    "keycloak": {
      "image": "quay.io/keycloak/keycloak:26.8.2",
      "command": [
        "start",
        "--import-realm"
      ],
      "environment": {
        "KC_DB": "postgres",
        "KC_DB_URL": "jdbc:postgresql://identity-db:5432/keycloak",
        "KC_DB_USERNAME": "keycloak",
        "KC_DB_PASSWORD": "${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD setzen}",
        "KC_HOSTNAME": "${APP_URL:?APP_URL setzen}/auth",
        "KC_HTTP_ENABLED": "true",
        "KC_HTTP_RELATIVE_PATH": "/auth",
        "KC_PROXY_HEADERS": "xforwarded",
        "KC_BOOTSTRAP_ADMIN_USERNAME": "${KEYCLOAK_ADMIN_USER:-bootstrap}",
        "KC_BOOTSTRAP_ADMIN_PASSWORD": "${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD setzen}",
        "APP_URL": "${APP_URL:?APP_URL setzen}",
        "OIDC_CLIENT_SECRET": "${OIDC_CLIENT_SECRET:?OIDC_CLIENT_SECRET setzen}"
      },
      "volumes": [
        "./keycloak/kundenraum-realm.json:/opt/keycloak/data/import/kundenraum-realm.json:ro",
        "./keycloak/theme/kundenraum:/opt/keycloak/themes/kundenraum:ro"
      ],
      "depends_on": {
        "identity-db": {
          "condition": "service_healthy"
        }
      },
      "restart": "unless-stopped"
    },
    "web": {
      "image": "kundenraum:${APP_VERSION:-0.2.0}",
      "build": ".",
      "environment": {
        "NODE_ENV": "production",
        "APP_URL": "${APP_URL:?APP_URL setzen}",
        "DATABASE_URL": "${DATABASE_URL:?DATABASE_URL setzen}",
        "SESSION_ENCRYPTION_KEY": "${SESSION_ENCRYPTION_KEY:?SESSION_ENCRYPTION_KEY setzen}",
        "OIDC_ISSUER": "${APP_URL:?APP_URL setzen}/auth/realms/kundenraum",
        "OIDC_INTERNAL_URL": "http://keycloak:8080/auth",
        "OIDC_ADMIN_URL": "http://keycloak:8080/auth/admin/realms/kundenraum",
        "OIDC_CLIENT_ID": "kundenraum-web",
        "OIDC_CLIENT_SECRET": "${OIDC_CLIENT_SECRET:?OIDC_CLIENT_SECRET setzen}",
        "OIDC_API_AUDIENCE": "kundenraum-api",
        "OIDC_PROXY_ENABLED": "false",
        "ALLOW_LOCAL_HTTP": "false",
        "WHATSAPP_API_VERSION": "${WHATSAPP_API_VERSION:-}",
        "WHATSAPP_TOKEN": "${WHATSAPP_TOKEN:-}",
        "WHATSAPP_PHONE_ID": "${WHATSAPP_PHONE_ID:-}",
        "WHATSAPP_TEMPLATE": "${WHATSAPP_TEMPLATE:-}",
        "WHATSAPP_LANGUAGE": "${WHATSAPP_LANGUAGE:-}",
        "WHATSAPP_TEST_NUMBER": "${WHATSAPP_TEST_NUMBER:-}",
        "TELEGRAM_BOT_TOKEN": "${TELEGRAM_BOT_TOKEN:-}",
        "TELEGRAM_CHAT_ID": "${TELEGRAM_CHAT_ID:-}"
      },
      "expose": [
        "3000"
      ],
      "depends_on": {
        "db": {
          "condition": "service_healthy"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ],
        "interval": "30s",
        "timeout": "10s",
        "retries": 5
      },
      "restart": "unless-stopped"
    },
    "worker": {
      "image": "kundenraum:${APP_VERSION:-0.2.0}",
      "command": [
        "npm",
        "run",
        "worker"
      ],
      "environment": {
        "WHATSAPP_API_VERSION": "${WHATSAPP_API_VERSION:-}",
        "WHATSAPP_TOKEN": "${WHATSAPP_TOKEN:-}",
        "WHATSAPP_PHONE_ID": "${WHATSAPP_PHONE_ID:-}",
        "WHATSAPP_TEMPLATE": "${WHATSAPP_TEMPLATE:-}",
        "WHATSAPP_LANGUAGE": "${WHATSAPP_LANGUAGE:-}",
        "WHATSAPP_TEST_NUMBER": "${WHATSAPP_TEST_NUMBER:-}",
        "TELEGRAM_BOT_TOKEN": "${TELEGRAM_BOT_TOKEN:-}",
        "TELEGRAM_CHAT_ID": "${TELEGRAM_CHAT_ID:-}",
        "DATABASE_URL": "${DATABASE_URL:?DATABASE_URL setzen}"
      },
      "depends_on": {
        "db": {
          "condition": "service_healthy"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "node",
          "-e",
          "const f=require('fs'),p=require('path').join(require('os').tmpdir(),'kundenraum-worker-heartbeat');try{process.exit(Date.now()-f.statSync(p).mtimeMs<180000?0:1)}catch{process.exit(1)}"
        ],
        "interval": "60s",
        "timeout": "5s",
        "start_period": "90s",
        "retries": 3
      },
      "restart": "unless-stopped"
    },
    "caddy": {
      "image": "caddy:2.11.9-alpine",
      "environment": {
        "PUBLIC_DOMAIN": "${PUBLIC_DOMAIN:?PUBLIC_DOMAIN setzen}",
        "TLS_EMAIL": "${TLS_EMAIL:?TLS_EMAIL setzen}"
      },
      "ports": [
        "80:80",
        "443:443"
      ],
      "volumes": [
        "./deploy/Caddyfile:/etc/caddy/Caddyfile:ro",
        "caddy-data:/data",
        "caddy-config:/config"
      ],
      "depends_on": [
        "web",
        "keycloak"
      ],
      "restart": "unless-stopped"
    },
    "migrate": {
      "profiles": [
        "tools"
      ],
      "image": "kundenraum:${APP_VERSION:-0.2.0}",
      "command": [
        "npm",
        "run",
        "migrate"
      ],
      "environment": {
        "DATABASE_URL": "${DATABASE_URL:?DATABASE_URL setzen}"
      },
      "depends_on": {
        "db": {
          "condition": "service_healthy"
        }
      },
      "volumes": [
        "./transfer:/transfer:ro"
      ]
    },
    "bootstrap": {
      "profiles": [
        "tools"
      ],
      "image": "kundenraum:${APP_VERSION:-0.2.0}",
      "command": [
        "node",
        "scripts/bootstrap-identity.mjs"
      ],
      "environment": {
        "OIDC_INTERNAL_URL": "http://keycloak:8080/auth",
        "OIDC_ADMIN_URL": "http://keycloak:8080/auth/admin/realms/kundenraum",
        "KEYCLOAK_ADMIN_USER": "${KEYCLOAK_ADMIN_USER:-bootstrap}",
        "KEYCLOAK_ADMIN_PASSWORD": "${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD setzen}",
        "INITIAL_ADMIN_USERNAME": "${INITIAL_ADMIN_USERNAME:?INITIAL_ADMIN_USERNAME setzen}",
        "INITIAL_ADMIN_PASSWORD": "${INITIAL_ADMIN_PASSWORD:?INITIAL_ADMIN_PASSWORD setzen}"
      },
      "depends_on": [
        "keycloak"
      ]
    }
  },
  "volumes": {
    "customer-db-data": {},
    "identity-db-data": {},
    "caddy-data": {},
    "caddy-config": {}
  }
}
